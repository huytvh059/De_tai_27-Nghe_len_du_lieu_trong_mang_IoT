# Cấu hình Mosquitto Broker cho Đề tài 27

# Khởi chạy trên cổng mặc định, chỉ lắng nghe ở localhost để đảm bảo an toàn
listener 1883 127.0.0.1

# Vô hiệu hóa truy cập ẩn danh (yêu cầu username/password)
allow_anonymous false

# Đường dẫn đến tệp mật khẩu (chứa thông tin người dùng được băm mã hóa)
password_file configs/passwd

# Đường dẫn đến tệp cấu hình ACL (Access Control List) để phân quyền topic
acl_file configs/aclfile

# Lưu trữ dữ liệu phiên (persistence)
persistence true
persistence_location data/

# Cấu hình log ghi nhận hoạt động
log_dest file results/logs/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
